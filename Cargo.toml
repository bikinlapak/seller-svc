[package]
name = "seller-svc"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[lib]
name = "seller_svc"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
# Klien GraphQL ke works-server. rustls-tls di reqwest 0.12 memakai ring, jadi
# tidak menarik aws-lc-sys (dan cmake) ke dalam build — sama alasannya
# dengan works-core.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = "9"
ulid = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
ring = "0.17"
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
