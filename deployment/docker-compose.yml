# Local stack: edge (Caddy) → seller-app (SvelteKit) → seller-svc (Rust).
#
# Expects ../seller-app checked out next to seller-svc. From this directory:
#
#   cp .env.example .env              # optional; every value has a default
#   docker compose up --build -d
#   open http://localhost:3000        # through the proxy (use this one)
#   curl http://localhost:8080/healthz
#   ../../e2e.sh                      # end-to-end check against the running stack
#
# Caddy's config is in ./Caddyfile (why the proxy exists is explained there).

# Same project name as before the move, so existing containers are reused.
name: bikinlapak

services:
  # The shared runtime base (../Dockerfile.base), built locally so the stack
  # never needs Artifact Registry access. It only exists to be built: the
  # container runs `true` and exits.
  base:
    build:
      context: ..
      dockerfile: Dockerfile.base
    image: bikinlapak-base:local
    command: ["true"]
    restart: "no"

  seller-svc:
    # Same thin app image as Cloud Run (../Dockerfile.app), FROM the local base.
    build:
      context: ..
      dockerfile: Dockerfile.app
      args:
        BASE_IMAGE: bikinlapak-base
      additional_contexts:
        bikinlapak-base: service:base
    environment:
      SELLER_SVC_BIND_ADDR: 0.0.0.0:8080
      SELLER_SVC_LOG_JSON: "false"
      SELLER_SVC_WORKS_GRAPHQL_URL: ${SELLER_SVC_WORKS_GRAPHQL_URL:-http://host.docker.internal:8000/graphql}
      SELLER_SVC_CORS_ORIGINS: http://localhost:${APP_PORT:-3000}
      # See .env.example for what each of these does when empty.
      SELLER_SVC_ACTION_KEY: ${SELLER_SVC_ACTION_KEY:-}
      SELLER_SVC_GEMINI_API_KEY: ${SELLER_SVC_GEMINI_API_KEY:-}
      SELLER_SVC_GEMINI_MODEL: ${SELLER_SVC_GEMINI_MODEL:-gemini-2.5-flash}
      RUST_LOG: ${RUST_LOG:-seller_svc=debug,tower_http=info}
    ports:
      - "${SVC_PORT:-8080}:8080"
    healthcheck:
      # The runtime image has no curl; bash's /dev/tcp is enough for liveness.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 3s
      retries: 10

  # seller-app's runtime base (../../seller-app/Dockerfile.base), same idea.
  front-base:
    build:
      context: ../../seller-app
      dockerfile: Dockerfile.base
    image: bikinlapak-front-base:local
    command: ["true"]
    restart: "no"

  seller-app:
    build:
      context: ../../seller-app
      dockerfile: Dockerfile.app
      args:
        BASE_IMAGE: bikinlapak-front-base
      additional_contexts:
        bikinlapak-front-base: service:front-base
    environment:
      PORT: 3000
      SELLER_SVC_URL: http://seller-svc:8080
      SELLER_SVC_MOCK: ${SELLER_SVC_MOCK:-false}
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
    depends_on:
      seller-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/assistant').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  edge:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      LOG_REQUESTS: ${LOG_REQUESTS:-0}
    ports:
      - "${APP_PORT:-3000}:80"
    depends_on:
      seller-app:
        condition: service_healthy
