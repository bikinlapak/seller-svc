name: Deploy

# Test stage: triggered from branch feature/test_deployment (this repo is
# currently read-only for the agent; it will be pushed once write access is
# granted). After E2E is proven, switch the trigger to [main, master].
on:
  push:
    branches: [feature/test_deployment]
  workflow_dispatch:

# No service-account keys anywhere: `id-token: write` makes GitHub mint an
# OIDC token, exchanged at GCP through Workload Identity Federation
# (infra/github.tf).
permissions:
  contents: read
  id-token: write

# One deploy at a time; queued runs are cancelled so an old revision never
# overtakes a new one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fat toolchain image: built once, reused by every deploy. Bump the tag
  # only on toolchain upgrades.
  BASE_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/seller-svc-base:v1

jobs:
  deploy:
    runs-on: [self-hosted]
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Authorize docker push to Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Verify or build base image
        run: |
          if docker pull "${BASE_IMAGE}" 2>/dev/null; then
            echo "==> Base image found in registry: ${BASE_IMAGE}"
          else
            echo "==> Base image not found. Building from Dockerfile.base ..."
            docker build -f Dockerfile.base -t "${BASE_IMAGE}" .
            docker push "${BASE_IMAGE}"
          fi

      - name: Build & push
        id: build
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/seller-svc:${{ github.sha }}"
          docker build -f Dockerfile.app --build-arg BASE_IMAGE="${BASE_IMAGE}" -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy seller-svc-${{ vars.ENV_NAME }} \
            --image="${{ steps.build.outputs.image }}" \
            --region="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --quiet

      - name: Wait for a healthy revision
        run: |
          URL=$(gcloud run services describe seller-svc-${{ vars.ENV_NAME }} \
            --region="${{ vars.GCP_REGION }}" --project="${{ vars.GCP_PROJECT_ID }}" \
            --format='value(status.url)')
          echo "Deployed: $URL"
