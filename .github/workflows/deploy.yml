name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Tidak ada kunci service account di mana pun: `id-token: write` yang
# membuat GitHub menerbitkan OIDC token, lalu ditukar ke GCP lewat Workload
# Identity Federation (infra/github.tf di seller-svc).
permissions:
  contents: read
  id-token: write

# Satu deploy berjalan pada satu waktu; yang antre dibatalkan supaya revisi
# lama tidak menyusul revisi baru.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Izinkan docker push ke Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build & push
        id: build
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/seller-svc:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy ke Cloud Run
        run: |
          gcloud run deploy seller-svc-${{ vars.ENV_NAME }} \
            --image="${{ steps.build.outputs.image }}" \
            --region="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --quiet

      - name: Tunggu revisi sehat
        run: |
          URL=$(gcloud run services describe seller-svc-${{ vars.ENV_NAME }} \
            --region="${{ vars.GCP_REGION }}" --project="${{ vars.GCP_PROJECT_ID }}" \
            --format='value(status.url)')
          echo "Deployed: $URL"
