# Local stack: seller-app (SvelteKit, adapter-node) in front of seller-svc (Rust).
#
# Lives in seller-svc; expects ../seller-app checked out next to it.
#
#   docker compose up --build -d      # from seller-svc/
#   open http://localhost:3000        # through the proxy (use this one)
#   curl http://localhost:8080/healthz
#   ../e2e.sh                         # end-to-end check against the running stack
#
# Why the `edge` proxy: adapter-node in SvelteKit 3 no longer reads ORIGIN and
# assumes https when no protocol header is set, so every form POST on plain
# http://localhost would fail the CSRF check (403). Caddy sets
# X-Forwarded-Proto / X-Forwarded-Host the way Cloud Run's front end does, and
# seller-app is configured to trust them — same setup as production.

# Same project name as before the move, so existing containers are reused.
name: bikinlapak

services:
  seller-svc:
    build: .
    environment:
      SELLER_SVC_BIND_ADDR: 0.0.0.0:8080
      SELLER_SVC_LOG_JSON: "false"
      SELLER_SVC_WORKS_GRAPHQL_URL: ${SELLER_SVC_WORKS_GRAPHQL_URL:-http://host.docker.internal:8000/graphql}
      SELLER_SVC_CORS_ORIGINS: http://localhost:3000
      # Empty = ephemeral key: action tokens die on every restart. Fine locally.
      SELLER_SVC_ACTION_KEY: ${SELLER_SVC_ACTION_KEY:-}
      # Empty = the vision stand-in; set a key to read waste photos with Gemini.
      SELLER_SVC_GEMINI_API_KEY: ${SELLER_SVC_GEMINI_API_KEY:-}
      SELLER_SVC_GEMINI_MODEL: ${SELLER_SVC_GEMINI_MODEL:-gemini-2.5-flash}
      RUST_LOG: seller_svc=debug,tower_http=info
    ports:
      - "8080:8080"
    healthcheck:
      # The runtime image has no curl; bash's /dev/tcp is enough for liveness.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 3s
      retries: 10

  seller-app:
    build: ../seller-app
    environment:
      PORT: 3000
      SELLER_SVC_URL: http://seller-svc:8080
      SELLER_SVC_MOCK: "false"
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
    depends_on:
      seller-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/assistant').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  edge:
    image: caddy:2-alpine
    command: caddy reverse-proxy --from :80 --to seller-app:3000
    ports:
      - "3000:80"
    depends_on:
      seller-app:
        condition: service_healthy
